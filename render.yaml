services:
  - type: web
    name: tap-hunter-english
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false # Điền connection string Neon PostgreSQL: postgresql://[user]:[password]@[endpoint].neon.tech/[dbname]?sslmode=require
